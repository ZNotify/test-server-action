name: Test

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .yarn/releases/yarn-3.3.0.cjs install --immutable
      - run: node .yarn/releases/yarn-3.3.0.cjs test
      - run: node .yarn/releases/yarn-3.3.0.cjs exec tsc --noEmit
      - run: node .yarn/releases/yarn-3.3.0.cjs build
      - run: git diff --exit-code -- dist

  test-require-current-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: strict
        continue-on-error: true
        with:
          require-current-artifact: true
      - name: Verify missing artifact fails without release fallback
        if: always()
        shell: bash
        run: test '${{ steps.strict.outcome }}' = 'failure'

  upload-artifact:
    needs: [unit-tests, test-download-release, test-require-current-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Download release
        run: |
          wget -q -O test-server-linux https://github.com/ZNotify/server/releases/download/test/test-server-linux
          wget -q -O test-server-macos https://github.com/ZNotify/server/releases/download/test/test-server-macos
          wget -q -O test-server-windows.exe https://github.com/ZNotify/server/releases/download/test/test-server-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: |
            test-server-linux
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-macos
          path: |
            test-server-macos
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: |
            test-server-windows.exe
          if-no-files-found: error

  test-download-artifact:
    needs: upload-artifact
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: ./
        with:
          require-current-artifact: true

      - name: Test Port
        shell: bash
        run: curl -s -v -o tmp --trace-time http://127.0.0.1:14444/alive
  
  test-download-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: ./
      
      - name: Test Port
        shell: bash
        run: curl -s -v -o tmp --trace-time http://127.0.0.1:14444/alive
